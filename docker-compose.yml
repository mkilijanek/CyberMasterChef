services:
  cybermasterchef:
    image: ghcr.io/mkilijanek/cybermasterchef:latest
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  cybermasterchef-local:
    profiles: ["local"]
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/mkilijanek/cybermasterchef:local
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
